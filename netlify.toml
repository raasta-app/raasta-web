# Netlify config for the Raasta landing page — static site, no build step.

[build]
  publish = "."

# ── Security headers — applied to every response ──────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()"
    # CSP allowlist covers exactly what the site loads: Google Fonts, GA4
    # (gtag + collect), and the waitlist POST to Apps Script. Inline styles are
    # allowed because the page uses style="" attributes and an injected <style>;
    # scripts stay strict (no inline executable JS on the site).
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://script.google.com https://script.googleusercontent.com; form-action 'self'"

# ── Caching ───────────────────────────────────────────────────────────────────
# Filenames are NOT content-hashed, so windows are deliberately conservative.
# To push an asset update sooner, rename the file or lower its max-age; Netlify
# purges its own CDN on every deploy regardless. HTML is left on Netlify's
# default (revalidate) so page updates always go live immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"   # 7 days — images, video, icons

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"     # 1 day — not fingerprinted

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"     # 1 day — not fingerprinted
